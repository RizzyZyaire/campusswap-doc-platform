# 自动化测试专用 profile（由 @ActiveProfiles("test") 激活，也可 `mvnw test -Dspring.profiles.active=test`）
#
# 为什么需要它：dev 的 Hikari 连接池是 maximum-pool-size=10，而「100 线程并发自增」这类
# 测试需要 100 个线程真的同时打到数据库上。池子只有 10 的话，100 个线程会全部堵在池子上
# 排队执行，断言照样通过，但那是**假并发**（等于串行验证）。这里把池子放大到 120。
#
# 库与 Redis 与 dev 完全一致（campusswap_db），测试只碰自己插入的临时行并在 @AfterEach 清理，
# 不动种子数据。详见 docs/03-qa-review/COURSEWARE-CLOSURE.md。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campusswap_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 注意：这里刻意不叫 DB_USERNAME / DB_PASSWORD。
    # 机检脚本 verify-m2.ps1 / verify-db-deep.ps1 要求 $env:DB_PASSWORD = root 的口令（123456），
    # 而 Spring 会把同名环境变量插值进来 —— 2026-09-23 实测踩到：
    # 先跑机检再跑 mvnw test，测试 JVM 会拿 root 口令去连 campusswap_dev，6 个用例全部
    # "Access denied ... (using password: YES)" 报错（而 dev 应用靠已建好的连接池照常工作，
    # 所以三个 HTTP 机检仍然全绿，极具迷惑性）。改用专属变量名后彻底解耦。
    username: ${CAMPUSSWAP_TEST_DB_USER:campusswap_dev}
    password: ${CAMPUSSWAP_TEST_DB_PASSWORD:CampusSwap@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 120
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      # 表结构只来自 backend/sql/schema.sql，测试同样不允许 Hibernate 改表
      ddl-auto: none
    # 并发测试会打 100 条 SQL；关掉 show-sql，输出留给断言结果
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms

  # 消息队列（课件 13.1）：RabbitMQ 4.0.5，异步索引重建。
  # broker 没启动时应用照常启动（监听容器后台重连），只是"提交重建任务"会返回 FAILED 并说明原因。
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:campusswap}
    password: ${RABBITMQ_PASSWORD:CampusSwap@2026}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 3s
    listener:
      simple:
        acknowledge-mode: manual
        missing-queues-fatal: false
        prefetch: 1

  # 测试同样走真实 JWT 签发（不 mock 掉安全链路）
  # JWT（老师《作业说明》"JWT 登录"）：HS256 签名，密钥至少 32 字节。
# token 仍写入 Redis（login:token:*）以保留"退出后立即失效 / 一键踢人"能力，见 ARCHITECTURE §5.2。
campusswap:
  security:
    jwt:
      secret: ${JWT_SECRET:CampusSwap-Dev-HS256-Secret-Key-Do-Not-Use-In-Production-2026}
      issuer: campusswap
      ttl-minutes: 120

logging:
  level:
    com.campusswap: warn
