# =============================================================================
#  演示/交付环境配置（application-demo.yml）
#
#  用途：把「一个 jar + 自带数据库」的演示包跑起来，别人不需要装 Node、不需要
#        改任何配置文件，只需要有 JDK 17（数据库与 Redis 由包内脚本拉起）。
#
#  与 dev 的三点差别：
#   1) 连的是**包内便携 MySQL**（默认 3307，root 空口令的实例里已建好 campusswap_db
#      与最小权限账号 campusswap_dev），因此端口可被启动脚本用 --spring.datasource.url 覆盖；
#   2) 连的是**包内便携 Redis**（默认 6380，避开本机可能已存在的 6379）；
#   3) show-sql 关闭：演示时不需要刷屏的 SQL 日志（机检读日志用的是 dev profile）。
#
#  用法（启动脚本里就是这么调的）：
#    java -jar campusswap-backend-1.0.0.jar --spring.profiles.active=demo
#  覆盖端口示例：
#    --server.port=10087 --spring.datasource.url=jdbc:mysql://127.0.0.1:3307/campusswap_db?...
#
#  @author Zyaire
# =============================================================================
spring:
  datasource:
    url: ${DEMO_DB_URL:jdbc:mysql://127.0.0.1:3307/campusswap_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DEMO_DB_USERNAME:campusswap_dev}
    password: ${DEMO_DB_PASSWORD:CampusSwap@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    hibernate:
      # 表结构与数据随便携数据库一起分发，应用永远不改表
      ddl-auto: none
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: ${DEMO_REDIS_HOST:127.0.0.1}
      port: ${DEMO_REDIS_PORT:6380}
      database: 0
      timeout: 3000ms
  # 全文检索：演示包里**不带** ES（解压后 750 MB），地址可配置；
  # 没有 ES 时检索自动降级到 MySQL 引擎（接口照常返回，engine=mysql），
  # 界面会提示"Elasticsearch 未连接，已降级"。装了 ES 的机器自动启用 ES 引擎。
  # 消息队列（课件 13.1）：RabbitMQ 4.0.5，异步索引重建。
  # broker 没启动时应用照常启动（监听容器后台重连），只是"提交重建任务"会返回 FAILED 并说明原因。
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:campusswap}
    password: ${RABBITMQ_PASSWORD:CampusSwap@2026}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 3s
    listener:
      simple:
        acknowledge-mode: manual
        missing-queues-fatal: false
        prefetch: 1
  elasticsearch:
    uris: ${ES_URIS:http://127.0.0.1:9200}
    connection-timeout: 2s
    socket-timeout: 3s

logging:
  level:
    root: info
    com.campusswap: info
  # JWT（老师《作业说明》"JWT 登录"）：HS256 签名，密钥至少 32 字节。
# token 仍写入 Redis（login:token:*）以保留"退出后立即失效 / 一键踢人"能力，见 ARCHITECTURE §5.2。
campusswap:
  security:
    jwt:
      secret: ${JWT_SECRET:CampusSwap-Dev-HS256-Secret-Key-Do-Not-Use-In-Production-2026}
      issuer: campusswap
      ttl-minutes: 120