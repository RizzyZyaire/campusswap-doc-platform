# 开发环境配置（本机单实例）
# 数据库：campusswap_db，应用账号 campusswap_dev（最小权限，仅 CRUD），密码走环境变量
# Redis ：本机 5.0.14，端口 6379
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campusswap_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:campusswap_dev}
    password: ${DB_PASSWORD:CampusSwap@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    hibernate:
      # 表结构只来自 backend/sql/schema.sql，永远不让 Hibernate 改表
      ddl-auto: none
    show-sql: true
    # 关闭 open-in-view：禁止在视图渲染阶段触发懒加载（那是 N+1 的温床）
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
  # 全文检索（课件 10.1）：ES 9.4.5 + IK 分词器，本机 9200（版本必须与客户端同大版本，见 M8-CLOSURE）。
  # 超时 deliberately 很短：ES 没启动时检索要**快速降级**到 MySQL 引擎，
  # 不能让用户等在默认 30 秒的连接超时上。
  # 消息队列（课件 13.1）：RabbitMQ 4.0.9，异步索引重建。
  # broker 没启动时应用照常启动（监听容器后台重连），只是"提交重建任务"会返回 FAILED 并说明原因。
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:campusswap}
    password: ${RABBITMQ_PASSWORD:CampusSwap@2026}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 3s
    listener:
      simple:
        acknowledge-mode: manual
        missing-queues-fatal: false
        prefetch: 1
  elasticsearch:
    uris: ${ES_URIS:http://127.0.0.1:9200}
    connection-timeout: 2s
    socket-timeout: 3s

logging:
  level:
    com.campusswap: debug
